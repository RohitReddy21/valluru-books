    - generic [ref=f1e56]:
      - heading "Why This Exists" [level=2] [ref=f1e57]
      - generic [ref=f1e58]:
        - paragraph [ref=f1e59]: Modern life teaches us how to function.
        - paragraph [ref=f1e60]: It teaches us how to earn, deliver, lead, migrate, manage, respond, recover, explain, and keep moving. It teaches us how to optimize nearly everything.
        - paragraph [ref=f1e61]: But it does not always teach us how to stand when grief enters the room.
        - paragraph [ref=f1e62]: It does not teach us what to do when duty becomes heavy, when the gods seem silent, when language fails, when achievement does not settle the heart, when responsibility becomes another face of ego, or when the person we built ourselves to be begins to feel too small for the life we are carrying.
        - paragraph [ref=f1e63]: These writings come from that place.
        - paragraph [ref=f1e64]: They draw from Sanātana Dharma, the Gita, Bhagavatam, Tripura Rahasya, Vijñāna Bhairava Tantra, Telugu poetry, nāda, bhakti, Siva, Krishna, Kāli, Kāśī, grief, memory, and lived experience.
        - paragraph [ref=f1e65]: Not to build a new doctrine.
        - paragraph [ref=f1e66]: To return the seeker to the inward fire.
