    - generic [ref=f1e158]:
      - heading "For Whom" [level=2] [ref=f1e159]
      - generic [ref=f1e160]:
        - paragraph [ref=f1e161]: These writings are for the urban exile with a thinking mind and a wounded heart.
        - paragraph [ref=f1e162]: The professional who appears fine. The immigrant who belongs everywhere and nowhere. The Indian who knows the tradition is somewhere inside, but cannot enter it through noise. The seeker who has watched too many sermons and still feels unanchored. The grieving parent, child, spouse, friend, or colleague who does not need motivational slogans. The reader who wants depth without theatrics.
        - paragraph [ref=f1e163]: You do not have to agree with everything here.
        - paragraph [ref=f1e164]: Sit with what speaks. Leave what does not. Return when needed.
