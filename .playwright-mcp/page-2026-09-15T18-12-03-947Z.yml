      - paragraph [ref=f1e24]: The Inward Fire Series · Sasidhar Valluru
      - heading "The Inward Fire Series" [level=1] [ref=f1e25]
      - paragraph [ref=f1e26]: Writings on dharma, grief, language, surrender, and the inner life.
      - generic [ref=f1e27]:
        - paragraph [ref=f1e28]: For the competent but tired seeker. For the person who has optimized career, family, duty, migration, survival, and reputation — but still needs an inward anchor when grief, silence, responsibility, and mortality arrive.
        - paragraph [ref=f1e29]: No spiritual performance. No costume. No promise of instant peace.
        - paragraph [ref=f1e30]: Only a set of writings for those who are still willing to look inward.
