services:
  - type: web
    name: valluru-books-backend
    env: node
    buildCommand: "cd backend && npm ci"
    startCommand: "cd backend && npm start"
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_BYTES
        value: 1073741824
    # Increase Nginx client max body size via Render's config
    headers:
      - path: /*
        name: "X-Content-Type-Options"
        value: "nosniff"
    healthCheckPath: /health
    autoDeploy: true
