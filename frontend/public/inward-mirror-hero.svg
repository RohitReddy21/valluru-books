<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Inward Mirror">
  <title>The Inward Mirror</title>
  <defs>
    <linearGradient id="above" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0A09"/>
      <stop offset="55%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1D1913"/>
    </linearGradient>

    <linearGradient id="below" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191510"/>
      <stop offset="60%" stop-color="#100E0B"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>

    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3E3BC" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#D8BC80" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C4A96B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C4A96B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lampEcho" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8BC80" stop-opacity="0.34"/>
      <stop offset="40%" stop-color="#C4A96B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#C4A96B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waterline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A96B" stop-opacity="0"/>
      <stop offset="28%" stop-color="#C4A96B" stop-opacity="0.22"/>
      <stop offset="68%" stop-color="#E4CE96" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A96B" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="ripple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A96B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4A96B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C4A96B" stop-opacity="0"/>
    </linearGradient>

    <!-- Keeps the left third dark so overlaid headings stay legible. -->
    <linearGradient id="textGuard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0908" stop-opacity="0.92"/>
      <stop offset="38%" stop-color="#0A0908" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0A0908" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0B0A09"/>
  <rect width="1600" height="470" fill="url(#above)"/>
  <rect y="470" width="1600" height="430" fill="url(#below)"/>

  <!-- The lamp above the surface, and its answering reflection below it. -->
  <ellipse cx="1090" cy="332" rx="430" ry="300" fill="url(#lamp)"/>
  <ellipse cx="1090" cy="318" rx="10" ry="19" fill="#F6EAC9" opacity="0.92" filter="url(#soften)"/>
  <ellipse cx="1090" cy="620" rx="380" ry="230" fill="url(#lampEcho)"/>
  <ellipse cx="1090" cy="612" rx="9" ry="24" fill="#E4CE96" opacity="0.4" filter="url(#soften)"/>

  <!-- The mirror line itself. -->
  <rect x="0" y="469" width="1600" height="2" fill="url(#waterline)"/>

  <g opacity="0.5">
    <rect x="250" y="523" width="1220" height="1" fill="url(#ripple)"/>
    <rect x="410" y="575" width="1060" height="1" fill="url(#ripple)" opacity="0.8"/>
    <rect x="300" y="641" width="1160" height="1" fill="url(#ripple)" opacity="0.6"/>
    <rect x="520" y="716" width="900" height="1" fill="url(#ripple)" opacity="0.45"/>
    <rect x="600" y="800" width="800" height="1" fill="url(#ripple)" opacity="0.3"/>
  </g>

  <rect width="1600" height="900" fill="url(#textGuard)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
